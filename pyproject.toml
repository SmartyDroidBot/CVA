[project]
name = "local-llm-cli"
version = "0.1.0"
description = "A Gemini-like CLI for local language models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "mcp>=0.9.0",
    "typing-extensions>=4.5.0",
    "pyyaml>=6.0",
    "typer>=0.12.3",
    "rich>=13.7.1",
    "prompt-toolkit>=3.0.47",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "structlog>=24.1.0",
    "pluggy>=1.5.0",
    "langchain-mcp-adapters>=0.1.0",
    "mcp-cli>=0.10.1",
]

[project.scripts]
llm = "local_llm_cli:main"
llm-mcp-filesystem = "local_llm_cli.mcp_servers.filesystem:main"
llm-mcp-math = "local_llm_cli.mcp_servers.math:main"
llm-mcp-system = "local_llm_cli.mcp_servers.system:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]
