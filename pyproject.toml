[project]
name = "cva"
version = "2.0.0"
description = "Cognitive VAPT Assistant — AI-powered penetration testing chatbot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3.0",
    "langchain-ollama>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langgraph>=0.4.0",
    "langgraph-checkpoint>=2.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pymongo>=4.10.0",
    "qdrant-client>=1.12.0",
    "rich>=13.9.0",
    "mcp>=1.2.0",
    "nest-asyncio>=1.6.0",
    "docker>=7.1.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "prompt-toolkit>=3.0.47",
    "pyyaml>=6.0.3",
    "pymetasploit3>=1.0.6",
    "paramiko>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
