# CVA MCP Servers Configuration
# 
# This file defines the MCP (Model Context Protocol) servers that CVA loads on startup.
# CVA uses a hybrid approach:
#   - Stateless tools (nmap, gobuster) are run via the generic `execute_shell_command` in cva_core.
#   - Stateful/Complex tools are loaded as dedicated MCP servers below.
#
# Set `enabled: false` to skip loading a server without removing its config.

mcp_servers:
  # ── Internal Core ──
  cva_core:
    command: "python"
    args: ["src/mcp_server/kali.py"]
    description: "Generic shell execution and local file reading"
    enabled: true

  exploitdb:
    command: "python"
    args: ["src/mcp_server/exploitdb.py"]
    description: "Search and retrieve PoCs from ExploitDB"
    enabled: true

  metasploit:
    command: "node"
    args: ["node_modules/metasploit-mcp-server/src/index.js"]
    env:
      MSF_PASSWORD: "msf"
    description: "Metasploit RPC integration for exploits and sessions"
    enabled: false  # Enable when msfrpcd is running
